const gridEl = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const searchEl = document.getElementById('search');
const filtersEl = document.getElementById('filters');
const toastEl = document.getElementById('toast');

let currentCategory = '全部';
let currentSearch = '';

function render() {
  const filtered = gifts.filter(g => {
    const catMatch = currentCategory === '全部' || g.category === currentCategory;
    const searchMatch = !currentSearch || g.name.includes(currentSearch) || g.query.toLowerCase().includes(currentSearch.toLowerCase());
    return catMatch && searchMatch;
  });
  statsEl.textContent = `顯示 ${filtered.length} 項禮物`;
  if (filtered.length === 0) {
    gridEl.innerHTML = '<div class="empty">沒有符合的禮物</div>';
    return;
  }
  gridEl.innerHTML = filtered.map(g => `
    <div class="card" data-id="${g.id}" onclick="openOriginal('${g.url}')">
      <div class="card-img-wrap">
        <img src="${g.url}" alt="${g.name}" loading="lazy" referrerpolicy="no-referrer">
        <span class="badge">${g.category}</span>
        <span class="badge-num">#${String(g.id).padStart(3,'0')}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${g.name}</div>
        <div class="card-query">${g.query}</div>
      </div>
    </div>
  `).join('');
}

function openOriginal(url) {
  window.open(url, '_blank');
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

filtersEl.addEventListener('click', e => {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentCategory = e.target.dataset.cat;
    render();
  }
});

searchEl.addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  render();
});

// Bulk download - triggered by user click so Chrome allows multi-download permission prompt
async function downloadAll() {
  showToast('開始下載 100 張圖片，請允許 Chrome 多重下載權限');
  let success = 0, failed = 0;
  for (const g of gifts) {
    try {
      const resp = await fetch(g.url, {mode: 'cors', referrerPolicy: 'no-referrer'});
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `${String(g.id).padStart(3,'0')}_${g.name}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
      success++;
      if (g.id % 10 === 0) showToast(`已下載 ${success} / 100…`);
      await new Promise(r => setTimeout(r, 300));
    } catch (e) {
      failed++;
      console.error('Failed:', g.id, e);
    }
  }
  showToast(`完成！成功 ${success} 失敗 ${failed}`);
}

document.getElementById('downloadAll').addEventListener('click', downloadAll);

render();
</script>
